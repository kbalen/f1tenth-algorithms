enhanced_f1tenth_racer:
  ros__parameters:
    # 🏁 SPEED SETTINGS (Like F1 Car Setup)
    max_speed: 7.0              # Maximum racing speed (m/s)
    min_speed: 2.0              # Minimum corner speed (m/s)
    straight_speed_boost: 1.15  # Speed boost on straights (15% increase)
    corner_speed_factor: 0.65   # Corner speed reduction (35% reduction)
    
    # 🎯 RACING LINE SETTINGS
    lookahead_distance: 2.0     # How far ahead driver "looks" (m)
    racing_line_aggression: 0.8 # Racing line aggression (0.5 = safe, 1.0 = very aggressive)
    
    # 🚨 SAFETY SETTINGS
    safety_margin: 0.35         # Distance from walls (m)